<?xml version="1.0" encoding="utf-8"?>
<!--
    The shape of a journey: walk, bike, walk (SPEC §5).

    The same drawing as the application's own, traced from
    app/src/main/res/drawable/illustration_journey.xml, at the same viewport
    and with the light theme's colour tokens written out: a README is not an
    Android resource, so the values are literal here. When the tokens move,
    this file and its dark twin move with them.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 40" width="480" height="80"
     role="img" aria-label="Walk, bike, walk">

    <!-- Departure, on foot: an outlined circle, because nothing is waiting
         there — it is where the user happens to be. -->
    <path d="M20,6a14,14 0 1,0 0.1,0z" fill="none" stroke="#55665F" stroke-width="2" />
    <g transform="translate(11.6,11.6) scale(0.7)">
        <path fill="#0F1714" d="M13.5,5.5c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM9.8,8.9L7,23h2.1l1.8,-8 2.1,2v6h2v-7.5l-2.1,-2 0.6,-3C14.8,12 16.8,13 19,13v-2c-1.9,0 -3.5,-1 -4.3,-2.4l-1,-1.6c-0.4,-0.6 -1,-1 -1.7,-1 -0.3,0 -0.5,0.1 -0.8,0.1L6,8.3V13h2V9.6l1.8,-0.7" />
    </g>

    <!-- Walking to the departure station. -->
    <path d="M38,20h7 M49,20h7 M60,20h7" fill="none" stroke="#55665F" stroke-linecap="round" stroke-width="2" />

    <!-- Departure station: a solid disc, like the markers on the map. -->
    <path d="M85,5a15,15 0 1,0 0.1,0z" fill="#0F6E56" />
    <g transform="translate(76.6,11.6) scale(0.7)">
        <path fill="#F9FCFA" d="M15.5,5.5c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM5,12c-2.8,0 -5,2.2 -5,5s2.2,5 5,5 5,-2.2 5,-5 -2.2,-5 -5,-5zM5,20.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5 -1.6,3.5 -3.5,3.5zM10.8,10.5l2.4,-2.4 0.8,0.8c1.3,1.3 3,2.1 5.1,2.1V9c-1.5,0 -2.7,-0.6 -3.6,-1.5l-1.9,-1.9c-0.5,-0.4 -1,-0.6 -1.6,-0.6s-1.1,0.2 -1.4,0.6L7.8,8.4c-0.4,0.4 -0.6,0.9 -0.6,1.4 0,0.6 0.2,1.1 0.6,1.4L11,14v5h2v-6.2l-2.2,-2.3zM19,12c-2.8,0 -5,2.2 -5,5s2.2,5 5,5 5,-2.2 5,-5 -2.2,-5 -5,-5zM19,20.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5 -1.6,3.5 -3.5,3.5z" />
    </g>

    <!-- The ride: one unbroken line, the journey's main leg. -->
    <path d="M102,20h36" fill="none" stroke="#0F6E56" stroke-linecap="round" stroke-width="3" />

    <!-- Arrival station, the same disc: one leaves a station and reaches a
         station, and the drawing must not suggest otherwise. -->
    <path d="M155,5a15,15 0 1,0 0.1,0z" fill="#0F6E56" />
    <g transform="translate(146.6,11.6) scale(0.7)">
        <path fill="#F9FCFA" d="M15.5,5.5c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM5,12c-2.8,0 -5,2.2 -5,5s2.2,5 5,5 5,-2.2 5,-5 -2.2,-5 -5,-5zM5,20.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5 -1.6,3.5 -3.5,3.5zM10.8,10.5l2.4,-2.4 0.8,0.8c1.3,1.3 3,2.1 5.1,2.1V9c-1.5,0 -2.7,-0.6 -3.6,-1.5l-1.9,-1.9c-0.5,-0.4 -1,-0.6 -1.6,-0.6s-1.1,0.2 -1.4,0.6L7.8,8.4c-0.4,0.4 -0.6,0.9 -0.6,1.4 0,0.6 0.2,1.1 0.6,1.4L11,14v5h2v-6.2l-2.2,-2.3zM19,12c-2.8,0 -5,2.2 -5,5s2.2,5 5,5 5,-2.2 5,-5 -2.2,-5 -5,-5zM19,20.5c-1.9,0 -3.5,-1.6 -3.5,-3.5s1.6,-3.5 3.5,-3.5 3.5,1.6 3.5,3.5 -1.6,3.5 -3.5,3.5z" />
    </g>

    <!-- Walking to the destination. -->
    <path d="M173,20h7 M184,20h7 M195,20h7" fill="none" stroke="#55665F" stroke-linecap="round" stroke-width="2" />

    <!-- Destination, on foot: outlined, like the departure. -->
    <path d="M220,6a14,14 0 1,0 0.1,0z" fill="none" stroke="#55665F" stroke-width="2" />
    <g transform="translate(211.6,11.6) scale(0.7)">
        <path fill="#0F1714" d="M13.5,5.5c1.1,0 2,-0.9 2,-2s-0.9,-2 -2,-2 -2,0.9 -2,2 0.9,2 2,2zM9.8,8.9L7,23h2.1l1.8,-8 2.1,2v6h2v-7.5l-2.1,-2 0.6,-3C14.8,12 16.8,13 19,13v-2c-1.9,0 -3.5,-1 -4.3,-2.4l-1,-1.6c-0.4,-0.6 -1,-1 -1.7,-1 -0.3,0 -0.5,0.1 -0.8,0.1L6,8.3V13h2V9.6l1.8,-0.7" />
    </g>
</svg>
